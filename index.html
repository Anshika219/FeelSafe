<!DOCTYPE html>
<html>
<head>
  <title>FeelSafe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff4e50, #fc913a);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .save-btn {
      background: #4CAF50;
      color: white;
    }

    .help-btn {
      background: #ff3b3b;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .help-btn:hover {
      background: #e60000;
    }

    .save-btn:hover {
      background: #3e8e41;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🚨 FeelSafe</h1>

  <input type="text" id="phone" placeholder="Enter emergency number">

  <button class="save-btn" onclick="saveContact()">Save Contact</button>

  <button class="help-btn" onclick="sendHelp()">HELP</button>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB4lAlyaP_Z9n-cZPLIaFlVEcm4nHLvCwA",
  authDomain: "feelsafe-web.firebaseapp.com",
  projectId: "feelsafe-web",
  storageBucket: "feelsafe-web.firebasestorage.app",
  messagingSenderId: "772887093142",
  appId: "1:772887093142:web:a670a5bca0d69bbb7c87b7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function saveContact() {
  const phone = document.getElementById("phone").value;

  db.collection("contacts").doc("user1").set({
    phone: phone
  })
  .then(() => alert("Contact saved!"))
  .catch((error) => console.error(error));
}


function sendHelp() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((position) => {
      
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      const locationLink = "https://maps.google.com/?q=" + lat + "," + lon;

      db.collection("contacts").doc("user1").get()
        .then((doc) => {
          if (doc.exists) {
            const phone = doc.data().phone;

            const message = "🚨 EMERGENCY! I need help.\nMy location: " + locationLink;

            const url = "https://wa.me/91" + phone + "?text=" + encodeURIComponent(message);

            window.open(url, "_blank");
          } else {
            alert("No contact saved!");
          }
        });

    }, () => {
      alert("Location access denied!");
    });
  } else {
    alert("Geolocation not supported!");
  }
}

</script>

</body>
</html>
