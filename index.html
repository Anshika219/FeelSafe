<body>

<h1>🚨 FeelSafe</h1>
<p>Your safety, one tap away</p>

<button class="sos-btn" onclick="sendSOS()">SOS</button>

<div class="actions">
    <a href="tel:112">📞 Call Emergency (112)</a>
</div>

<script>
function sendSOS() {

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {

            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;

            let locationLink = `https://maps.google.com/?q=${lat},${lon}`;

            let message = `🚨 HELP! I am in danger.\nMy location: ${locationLink}`;

            // Open WhatsApp with message
            window.location.href = `https://wa.me/?text=${encodeURIComponent(message)}`;

        }, function() {
            alert("Location access denied. Please enable GPS.");
        });
    } else {
        alert("Geolocation not supported.");
    }
}
</script>
